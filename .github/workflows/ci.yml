name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  STARTUP_TIMEOUT: 120

jobs:
  java-tests:
    name: Maven Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: ./mvnw -f api/pom.xml test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: api/target/surefire-reports/

  python-tests:
    name: Pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install pytest -r pipeline/requirements.txt

      - name: Run tests
        run: python3 -m pytest pipeline/tests/ -v

  startup-check:
    name: Docker Compose Startup Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build pipeline image and verify load scripts
        run: |
          docker compose -f docker-compose.yml build load-model
          docker compose -f docker-compose.yml run --rm --entrypoint sh load-model -c "test -x /app/load-model.sh && test -x /app/load-data.sh"

      - name: Start services
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --wait --wait-timeout ${{ env.STARTUP_TIMEOUT }}

      - name: Log service states
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml ps

      - name: Tear down services
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.ci.yml down
